<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magnifier</title>
<style>
  :root{
    --bg: #0d0f12;
    --panel: rgba(20,22,26,0.85);
    --accent: #ffd23f;
    --accent-dim: #d4ac2b;
    --text: #f2f2f0;
    --text-dim: #9a9d a2;
    --danger: #ff5c5c;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]){
      --bg: #0d0f12;
    }
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app{
    position: fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
  }

  /* ---- Start screen ---- */
  #start-screen{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: 22px; padding: 24px; text-align:center; max-width: 420px;
  }
  #start-screen .icon{
    font-size: 64px;
    filter: drop-shadow(0 4px 10px rgba(255,210,63,0.25));
  }
  #start-screen h1{
    margin:0; font-size: 22px; font-weight:600; letter-spacing:0.2px;
  }
  #start-screen p{
    margin:0; font-size: 14px; color:#b7bac0; line-height:1.5;
  }
  #start-btn{
    margin-top: 8px;
    background: var(--accent);
    color: #1a1a1a;
    border:none;
    font-size: 17px;
    font-weight: 700;
    padding: 16px 40px;
    border-radius: 999px;
    cursor:pointer;
    box-shadow: 0 6px 20px rgba(255,210,63,0.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  #start-btn:active{ transform: scale(0.96); box-shadow: 0 3px 10px rgba(255,210,63,0.25); }

  #error-box{
    display:none;
    background: rgba(255,92,92,0.12);
    border: 1px solid rgba(255,92,92,0.4);
    color: #ffb3b3;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height:1.5;
    max-width: 340px;
  }

  /* ---- Camera view ---- */
  #camera-screen{
    display:none;
    position: fixed; inset:0;
    background:#000;
  }
  #video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    transform-origin: center center;
    transition: filter .15s ease;
    background:#000;
  }
  canvas#capture-canvas{ display:none; }

  /* ---- Vertical toolbar, grouped top-right ---- */
  #toolbar{
    position:absolute;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    display:flex; flex-direction:column; align-items:center;
    gap: 10px;
    z-index: 5;
  }
  .icon-btn{
    width: 46px; height:46px;
    border-radius: 50%;
    border: none;
    background: rgba(20,20,20,0.55);
    backdrop-filter: blur(6px);
    color: var(--text);
    font-size: 20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn.active{ background: var(--accent); color:#1a1a1a; }

  #zoom-group{
    display:flex; flex-direction:column; align-items:center;
    background: rgba(20,20,20,0.55);
    backdrop-filter: blur(6px);
    border-radius: 26px;
    padding: 6px 0;
    gap: 2px;
  }
  #zoom-group button{
    width: 46px; height:40px;
    border:none; background:transparent; color:var(--text);
    font-size: 18px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #zoom-group button:active{ color: var(--accent); }
  #zoom-label{
    font-size:12.5px; color:#ddd; font-variant-numeric: tabular-nums;
    padding: 2px 0;
  }

  #freeze-btn{
    width: 58px; height:58px; border-radius:50%;
    background: var(--accent);
    border: 3px solid rgba(255,255,255,0.5);
    color:#1a1a1a;
    font-size: 22px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    margin-top: 4px;
  }
  #freeze-btn.frozen{ background:#fff; }

  #hint{
    position:absolute; top: max(14px, env(safe-area-inset-top)); left:0; right: 76px;
    text-align:center;
    font-size: 12.5px;
    color: rgba(255,255,255,0.75);
    z-index: 4;
    pointer-events:none;
  }

  .hidden{ display:none !important; }
</style>
</head>
<body>
<div id="app">

  <!-- START SCREEN -->
  <div id="start-screen">
    <div class="icon">🔍</div>
    <h1>Document Magnifier</h1>
    <p>Turn your camera into a full-screen magnifying glass with autofocus. Point it at a page, zoom in, and freeze the image to read comfortably.</p>
    <button id="start-btn">Start Camera</button>
    <div id="error-box"></div>
  </div>

  <!-- CAMERA SCREEN -->
  <div id="camera-screen">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="capture-canvas"></canvas>

    <div id="hint">Pinch or use +/− to zoom</div>

    <div id="toolbar">
      <button class="icon-btn" id="close-btn" title="Close">✕</button>
      <button class="icon-btn" id="fullscreen-btn" title="Fullscreen">⛶</button>
      <button class="icon-btn" id="contrast-btn" title="High contrast">◐</button>
      <button class="icon-btn" id="torch-btn" title="Flashlight">💡</button>
      <div id="zoom-group">
        <button id="zoom-up-btn" title="Zoom in">▲</button>
        <span id="zoom-label">1.0×</span>
        <button id="zoom-down-btn" title="Zoom out">▼</button>
      </div>
      <button id="freeze-btn" title="Freeze frame">❄️</button>
    </div>
  </div>

</div>

<script>
(function(){
  const startScreen = document.getElementById('start-screen');
  const cameraScreen = document.getElementById('camera-screen');
  const startBtn = document.getElementById('start-btn');
  const closeBtn = document.getElementById('close-btn');
  const errorBox = document.getElementById('error-box');
  const video = document.getElementById('video');
  const canvas = document.getElementById('capture-canvas');
  const zoomUpBtn = document.getElementById('zoom-up-btn');
  const zoomDownBtn = document.getElementById('zoom-down-btn');
  const zoomLabel = document.getElementById('zoom-label');
  const freezeBtn = document.getElementById('freeze-btn');
  const contrastBtn = document.getElementById('contrast-btn');
  const torchBtn = document.getElementById('torch-btn');
  const fullscreenBtn = document.getElementById('fullscreen-btn');
  const hint = document.getElementById('hint');

  let stream = null;
  let track = null;
  let capabilities = null;
  let usingNativeZoom = false;
  let currentZoom = 1;
  let frozen = false;
  let highContrast = false;
  let torchOn = false;
  let zoomMin = 1, zoomMax = 6, zoomStep = 0.1;

  // Pinch-to-zoom state (used as fallback via CSS transform when no native zoom)
  let pinchStartDist = null;
  let pinchStartZoom = 1;
  let cssZoom = 1;

  function showError(msg){
    errorBox.style.display = 'block';
    errorBox.textContent = msg;
  }

  function requestFullscreenSafe(){
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) {
      try { req.call(el).catch(()=>{}); } catch(e) {}
    }
  }

  function exitFullscreenSafe(){
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
    if (exit && (document.fullscreenElement || document.webkitFullscreenElement)) {
      try { exit.call(document).catch(()=>{}); } catch(e) {}
    }
  }

  async function startCamera(){
    errorBox.style.display = 'none';
    // Request fullscreen immediately inside the click handler, before any await,
    // so it still counts as a direct user gesture on strict browsers (e.g. Safari).
    requestFullscreenSafe();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError("This browser doesn't support camera access. Try opening this page in Safari or Chrome.");
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });
    } catch (err) {
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        showError("Camera access was denied. Please allow camera permission in your browser settings and try again.");
      } else if (err.name === 'NotFoundError') {
        showError("No camera was found on this device.");
      } else {
        showError("Couldn't start the camera: " + err.message);
      }
      return;
    }

    video.srcObject = stream;
    track = stream.getVideoTracks()[0];
    capabilities = (track.getCapabilities && track.getCapabilities()) || {};
    usingNativeZoom = !!capabilities.zoom;

    // Continuous autofocus / auto-exposure / auto white-balance where supported,
    // so the camera keeps re-focusing on the page as it moves.
    const advanced = [];
    if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
      advanced.push({ focusMode: 'continuous' });
    }
    if (capabilities.exposureMode && capabilities.exposureMode.includes('continuous')) {
      advanced.push({ exposureMode: 'continuous' });
    }
    if (capabilities.whiteBalanceMode && capabilities.whiteBalanceMode.includes('continuous')) {
      advanced.push({ whiteBalanceMode: 'continuous' });
    }
    if (advanced.length) {
      try { await track.applyConstraints({ advanced }); } catch(e) { /* not fatal */ }
    }

    if (usingNativeZoom) {
      zoomMin = capabilities.zoom.min ?? 1;
      zoomMax = capabilities.zoom.max ?? 6;
      zoomStep = capabilities.zoom.step || 0.1;
      currentZoom = zoomMin;
    } else {
      zoomMin = 1;
      zoomMax = 6;
      zoomStep = 0.1;
      currentZoom = 1;
    }
    updateZoomLabel();

    // Some browsers lock orientation while in fullscreen unless explicitly unlocked.
    if (screen.orientation && typeof screen.orientation.unlock === 'function') {
      try { screen.orientation.unlock(); } catch(e) {}
    }

    torchBtn.style.display = capabilities.torch ? 'flex' : 'none';

    startScreen.style.display = 'none';
    cameraScreen.style.display = 'block';

    setTimeout(()=>{ hint.style.opacity = '0'; hint.style.transition = 'opacity .6s'; }, 3500);
  }

  function updateZoomLabel(){
    zoomLabel.textContent = currentZoom.toFixed(1) + '×';
  }

  async function applyZoom(z){
    currentZoom = Math.min(zoomMax, Math.max(zoomMin, z));
    updateZoomLabel();
    if (usingNativeZoom && track) {
      try {
        await track.applyConstraints({ advanced: [{ zoom: currentZoom }] });
      } catch(e) { /* fall through to css */ }
    } else {
      cssZoom = currentZoom;
      video.style.transform = `scale(${cssZoom})`;
    }
  }

  zoomUpBtn.addEventListener('click', ()=> applyZoom(currentZoom + 0.1));
  zoomDownBtn.addEventListener('click', ()=> applyZoom(currentZoom - 0.1));

  // Pinch to zoom on the video
  function dist(t1, t2){
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  cameraScreen.addEventListener('touchstart', (e)=>{
    if (e.touches.length === 2) {
      pinchStartDist = dist(e.touches[0], e.touches[1]);
      pinchStartZoom = currentZoom;
    }
  }, { passive: true });

  cameraScreen.addEventListener('touchmove', (e)=>{
    if (e.touches.length === 2 && pinchStartDist) {
      const d = dist(e.touches[0], e.touches[1]);
      const ratio = d / pinchStartDist;
      let newZoom = Math.min(zoomMax, Math.max(zoomMin, pinchStartZoom * ratio));
      applyZoom(newZoom);
    }
  }, { passive: true });

  cameraScreen.addEventListener('touchend', (e)=>{
    if (e.touches.length < 2) pinchStartDist = null;
  });

  // Freeze frame (manual or automatic via stabilize)
  function setFrozen(state){
    frozen = state;
    freezeBtn.classList.toggle('frozen', frozen);
    freezeBtn.textContent = frozen ? '▶️' : '❄️';
    if (frozen) {
      video.pause();
    } else {
      video.play();
    }
  }

  freezeBtn.addEventListener('click', ()=>{
    setFrozen(!frozen);
  });

  // Fullscreen toggle
  fullscreenBtn.addEventListener('click', ()=>{
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      exitFullscreenSafe();
    } else {
      requestFullscreenSafe();
    }
  });

  // High contrast toggle (helps read faint text)
  contrastBtn.addEventListener('click', ()=>{
    highContrast = !highContrast;
    contrastBtn.classList.toggle('active', highContrast);
    video.style.filter = highContrast ? 'contrast(1.7) brightness(1.15) grayscale(0.15)' : 'none';
  });

  // Torch / flashlight
  torchBtn.addEventListener('click', async ()=>{
    if (!capabilities || !capabilities.torch || !track) return;
    torchOn = !torchOn;
    try {
      await track.applyConstraints({ advanced: [{ torch: torchOn }] });
      torchBtn.classList.toggle('active', torchOn);
    } catch(e) {
      torchOn = !torchOn;
    }
  });

  function stopCamera(){
    if (stream) {
      stream.getTracks().forEach(t=>t.stop());
      stream = null;
    }
    frozen = false;
    freezeBtn.classList.remove('frozen');
    freezeBtn.textContent = '❄️';
    video.style.filter = 'none';
    highContrast = false;
    contrastBtn.classList.remove('active');
    video.style.transform = 'scale(1)';
    cssZoom = 1;
    cameraScreen.style.display = 'none';
    startScreen.style.display = 'flex';
    exitFullscreenSafe();
  }

  startBtn.addEventListener('click', startCamera);
  closeBtn.addEventListener('click', stopCamera);
})();
</script>
</body>
</html>
